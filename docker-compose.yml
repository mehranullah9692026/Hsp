# Local development services only (PostgreSQL + Redis).
# NOTE: this file was written but NOT executed in the build environment (no Docker available there).
# Review before use. Do not use these credentials anywhere real.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hms_admin
      POSTGRES_PASSWORD: change_me_dev_only
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "change_me_dev_only"]
    ports: ["6379:6379"]
volumes:
  pgdata:
